<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midi Test</title>
    <style>.controls{color: black;}</style>
   <link rel="stylesheet" href="./styles/style.css">
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/html-midi-player@1.5.0"></script>
</head>
<body>
<h1>Midi Test</h1>
    Test Track, default sound-font.
<midi-player
  src="./art/testTrack.mid"
  sound-font visualizer="#myVisualizer">
</midi-player>
<midi-visualizer type="piano-roll" id="myVisualizer"></midi-visualizer>
    Intro, default sound-font.
<midi-player
  src="./art/Intro.mid"
  sound-font >
</midi-player>
Intro, SGM sound-font.
<midi-player
  src="./art/Intro.mid"
  sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus" >
</midi-player>
    Intro, no sound font.
<midi-player
  src="./art/Intro.mid" >
</midi-player>
IntroSGM, SGM sound-font.
<midi-player
  src="./art/IntroSGM.mid"
  sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus" >
</midi-player>
    
<script>

</script>
</body>
</html>
